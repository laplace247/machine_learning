<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Escenas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <h1>Clasificador de Escenas Naturales</h1>
        <p>Sube una imagen de un edificio, bosque, glaciar, montaña, mar o calle.</p>
        
        <input type="file" id="image-selector" accept="image/*">
        
        <div id="status">Cargando modelo... Por favor, espera.</div>
        
        <div id="image-display">
            <img id="selected-image" src="#" alt="Tu imagen" />
        </div>

        <div id="predictions"></div>
    </div>

    <!-- Cargar la librería TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <!-- Cargar nuestro script de lógica -->
    <script src="script.js"></script>
</body>
</html>
